<!DOCTYPE html>
<html>

<head>
    <title>Keyboard Events</title>
</head>

<body>
    <input type="text" id="inputBox" placeholder="Type here">
    <script>
        const input = document.getElementById("inputBox");
        input.addEventListener("keydown", () => alert("key down"));
        input.addEventListener("keyup", () => alert("key up"));
        input.addEventListener("keypress", () => alert("key press"));
    </script>
</body>

</html>
